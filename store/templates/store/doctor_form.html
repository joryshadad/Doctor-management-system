{% extends 'base.html' %}
{% block content %}
<section class="hero" style="min-height:25vh; padding-top:110px;"><div><h1>{{ title }}</h1><p>إدارة بيانات الطبيب من داخل واجهة العيادة.</p></div></section>
<section class="data-section">
  <div class="table-wrap" style="max-width:700px;margin:auto;">
    <form method="post" class="add-form" style="display:block;text-align:right;">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">حفظ البيانات</button>
      <a href="{% url 'doctors' %}" style="color:#ffd54f;margin-right:15px;">إلغاء</a>
    </form>
  </div>
</section>
{% endblock %}
